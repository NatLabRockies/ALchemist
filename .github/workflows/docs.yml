name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  # Cancel superseded PR builds only; never a deploy from a push, release or manual run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,docs]"
        env:
          SKIP_FRONTEND_BUILD: "1"
      # Release gate: a release cannot deploy placeholder pages.
      - name: Docs pages written
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: python docs/scripts/check_unwritten_pages.py
      - name: Export OpenAPI schema
        run: python docs/scripts/export_openapi.py
      - name: Build (strict)
        run: zensical build --strict --clean
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
