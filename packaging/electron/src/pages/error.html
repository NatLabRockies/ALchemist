<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>ALchemist</title>
<style>
  :root { color-scheme: light dark; --fg: #12475f; --muted: #5b6b75; --bg: #ffffff; --line: #c9d4da; }
  @media (prefers-color-scheme: dark) { :root { --fg: #d7e7ef; --muted: #9aa9b2; --bg: #14181b; --line: #34414a; } }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 0 24px; height: 100%; display: grid; align-content: center; gap: 16px; }
  h1 { margin: 0; font-size: 20px; }
  p { margin: 0; color: var(--muted); overflow-wrap: anywhere; }
  a { justify-self: start; color: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 6px 14px; text-decoration: none; }
  a:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1 id="title">Something went wrong</h1>
  <p id="message"></p>
  <a href="alchemist:open-logs">Open logs folder</a>
</main>
<script>
  const params = new URLSearchParams(location.search)
  document.getElementById('message').textContent = params.get('message') || ''
  if (params.get('title')) document.getElementById('title').textContent = params.get('title')
</script>
</body>
</html>
