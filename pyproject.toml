[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alchemist-nrel"
version = "0.3.4"
description = "Active learning and optimization toolkit for chemical and materials research"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Caleb Coatney", email = "caleb.coatney@nrel.gov"}]
license = {text = "BSD-3-Clause"}
keywords = ["active learning", "bayesian optimization", "gaussian processes", "materials science", "chemistry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "scikit-learn",
    "scikit-optimize",
    # 0.18 fixes fixed_features crashes and output shapes (used to hold variables
    # during acquisition); botorch 0.17.1+ requires gpytorch>=1.15.2.
    "botorch>=0.18.1",
    "torch>=2.4",
    "gpytorch>=1.15.2",
    "joblib",
    # FastAPI dependencies
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.6",  # For file uploads
    "requests",
    "httpx>=0.25.0",
    "pyDOE==0.9.5"
]

[project.scripts]
alchemist = "main:main"
alchemist-web = "api.run_api:main"

[project.optional-dependencies]
# Deprecated CustomTkinter desktop app (`alchemist`). The supported interface is
# the web app (`alchemist-web`). Only ui/ and main.py import these packages.
desktop = [
    "customtkinter",
    "tksheet",
    "ctkmessagebox",
    "mplcursors",
    "tabulate",
]
llm = [
    "openai>=1.50.0",        # covers OpenAI Responses API and Ollama (via base_url)
    "httpx>=0.25.0",         # Ollama model list + async HTTP (already a test dep)
    "edison-client>=0.1.0",  # optional: Edison Scientific literature search (PaperQA3)
]
docs = [
    "zensical==0.0.70",
    "mkdocstrings==1.0.7",
    "mkdocstrings-python==2.0.9",
    "pymdown-extensions==12.2",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-anyio>=0.0.0",
    "httpx>=0.25.0",  # Required for FastAPI TestClient
    "requests>=2.31.0",  # Required for some tests
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-anyio>=0.0.0",
    "httpx>=0.25.0",
    "requests>=2.31.0",
    "alchemist-nrel[desktop]",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["ui*", "alchemist_core*", "api*"]

[tool.setuptools.package-data]
api = ["static/**/*"]

[project.urls]
"Homepage" = "https://github.com/NatLabRockies/ALchemist"
"Documentation" = "https://natlabrockies.github.io/ALchemist/"
"Source" = "https://github.com/NatLabRockies/ALchemist"
"Bug Tracker" = "https://github.com/NatLabRockies/ALchemist/issues"
"Changelog" = "https://github.com/NatLabRockies/ALchemist/releases"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
]

[tool.coverage.run]
source = ["alchemist_core", "api"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "alchemist-web/*",
    "ui/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

